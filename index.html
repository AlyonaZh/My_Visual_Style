<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Курс художественных приёмов: пробуешь приём и отмечаешь, насколько он твой." />
    <title>Мой визуальный язык</title>
    <script>
      // Ставим тему до загрузки React, чтобы не было вспышки другой темы.
      // Логика совпадает с src/lib/theme.ts: сохранённый выбор, иначе настройки системы.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("my-visual-language:theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600&display=swap&subset=cyrillic"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
